<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>КлёвГид · Статистика</title>
<style>
  :root { --bg:#0f1419; --panel:#1a2129; --line:#2a333d; --fg:#e6edf3; --mut:#8b98a5; --acc:#4ea1ff; --good:#3fb950; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 system-ui,Segoe UI,Roboto,sans-serif; }
  header { display:flex; align-items:center; gap:16px; flex-wrap:wrap; padding:16px 22px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg); z-index:5; }
  h1 { font-size:18px; margin:0; }
  .sp { flex:1; }
  button, .btn { background:var(--panel); color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:8px 14px; cursor:pointer; font-size:13px; }
  button:hover { border-color:var(--acc); }
  .btn-primary { background:var(--acc); border-color:var(--acc); color:#001; font-weight:600; }
  main { padding:22px; max-width:1280px; margin:0 auto; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:22px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
  .card .n { font-size:26px; font-weight:700; }
  .card .l { color:var(--mut); font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
  section { margin-bottom:26px; }
  h2 { font-size:15px; color:var(--mut); border-bottom:1px solid var(--line); padding-bottom:6px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { text-align:left; padding:7px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--mut); font-weight:600; position:sticky; top:0; }
  tbody tr:hover { background:#ffffff08; }
  .scroll { max-height:420px; overflow:auto; border:1px solid var(--line); border-radius:10px; }
  .mut { color:var(--mut); }
  .tag { display:inline-block; background:#4ea1ff22; color:var(--acc); border-radius:5px; padding:1px 7px; font-size:12px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:22px; }
  @media(max-width:820px){ .grid2{ grid-template-columns:1fr; } }
  code { background:#0008; padding:1px 5px; border-radius:4px; font-size:12px; }
  #msg { font-size:13px; }
</style>
</head>
<body>
<header>
  <h1>🎣 КлёвГид · Статистика</h1>
  <span class="tag" id="gen"></span>
  <span class="sp"></span>
  <span id="msg" class="mut"></span>
  <button onclick="load()">↻ Обновить</button>
  <a class="btn" href="/api/admin/export">⬇ Экспорт JSON</a>
  <label class="btn">⬆ Импорт JSON<input id="imp" type="file" accept="application/json" hidden></label>
</header>
<main>
  <div class="cards" id="cards"></div>
  <div class="grid2">
    <section><h2>География (страны)</h2><div class="scroll"><table id="t-country"></table></div></section>
    <section><h2>Города</h2><div class="scroll"><table id="t-city"></table></div></section>
  </div>
  <div class="grid2">
    <section><h2>Что нажимали (топ событий)</h2><div class="scroll"><table id="t-events"></table></div></section>
    <section><h2>Зарегистрированные пользователи</h2><div class="scroll"><table id="t-users"></table></div></section>
  </div>
  <section><h2>Посетители (IP · откуда · время на сайте · события)</h2><div class="scroll"><table id="t-visitors"></table></div></section>
  <section><h2>Последние события</h2><div class="scroll"><table id="t-recent"></table></div></section>
</main>
<script>
const $ = s => document.querySelector(s);
const esc = s => (s==null?'':String(s)).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const mins = ms => ms ? (ms/60000).toFixed(1)+' мин' : '—';
const when = s => s ? s.replace('T',' ').slice(0,16) : '';

function table(el, cols, rows){
  const thead = '<thead><tr>'+cols.map(c=>`<th>${c[0]}</th>`).join('')+'</tr></thead>';
  const tbody = '<tbody>'+(rows.length?rows.map(r=>'<tr>'+cols.map(c=>`<td>${c[1](r)}</td>`).join('')+'</tr>').join(''):`<tr><td colspan="${cols.length}" class="mut">пусто</td></tr>`)+'</tbody>';
  $(el).innerHTML = thead+tbody;
}

async function load(){
  $('#msg').textContent = 'загрузка…';
  let d;
  try { const r = await fetch('/api/admin/stats',{cache:'no-store'}); if(!r.ok) throw new Error(r.status); d = await r.json(); }
  catch(e){ $('#msg').textContent = 'ошибка загрузки ('+e.message+')'; return; }
  $('#msg').textContent = '';
  $('#gen').textContent = 'обновлено '+when(d.generated_at);
  const t = d.totals||{};
  $('#cards').innerHTML = [
    ['Посетители', t.visitors], ['События', t.events], ['Пользователи', t.users],
    ['Стран', t.countries], ['Ср. время', (t.avg_minutes||0)+' мин']
  ].map(c=>`<div class="card"><div class="n">${c[1]??0}</div><div class="l">${c[0]}</div></div>`).join('');

  table('#t-country',[['Страна',r=>esc(r.country)],['Визитов',r=>r.n]], d.by_country||[]);
  table('#t-city',[['Город',r=>esc(r.city)],['Страна',r=>esc(r.country)],['Визитов',r=>r.n]], d.by_city||[]);
  table('#t-events',[['Тип',r=>`<span class="tag">${esc(r.type)}</span>`],['Метка',r=>esc(r.label)],['Раз',r=>r.n]], d.top_events||[]);
  table('#t-users',[['Email',r=>esc(r.email)],['Роль',r=>esc(r.role)],['Регистрация',r=>when(r.created_at)],['Вход',r=>when(r.last_login)]], d.users||[]);
  table('#t-visitors',[
    ['IP',r=>`<code>${esc(r.ip)}</code>`],['Страна',r=>esc(r.country)],['Город',r=>esc(r.city)],
    ['Провайдер',r=>esc(r.isp)],['Email',r=>esc(r.email)],['На сайте',r=>mins(r.total_ms)],
    ['Соб.',r=>r.events],['Первый',r=>when(r.first_seen)],['Последний',r=>when(r.last_seen)],
    ['Браузер',r=>`<span class="mut" title="${esc(r.user_agent)}">${esc((r.user_agent||'').slice(0,28))}</span>`]
  ], d.visitors||[]);
  table('#t-recent',[['Время',r=>when(r.ts)],['IP',r=>`<code>${esc(r.ip)}</code>`],['Страна',r=>esc(r.country)],['Тип',r=>`<span class="tag">${esc(r.type)}</span>`],['Метка',r=>esc(r.label)],['Email',r=>esc(r.email)]], d.recent_events||[]);
}

$('#imp').addEventListener('change', async e => {
  const f = e.target.files[0]; if(!f) return;
  $('#msg').textContent = 'импорт…';
  try {
    const text = await f.text();
    const r = await fetch('/api/admin/import',{method:'POST',headers:{'Content-Type':'application/json'},body:text});
    const j = await r.json();
    if(!r.ok) throw new Error(j.error||r.status);
    $('#msg').textContent = 'импортировано: '+JSON.stringify(j.imported);
    load();
  } catch(err){ $('#msg').textContent = 'ошибка импорта: '+err.message; }
  e.target.value = '';
});

load();
</script>
</body>
</html>
