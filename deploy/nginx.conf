# ============================================================
# КлёвГид (fishmania) — конфиг nginx для раздачи по IP сервера
# Положить в: /etc/nginx/sites-available/fishmania
# Требует зоны лимитов: deploy/nginx-ratelimit.conf → /etc/nginx/conf.d/
# Включить:   ln -s /etc/nginx/sites-available/fishmania /etc/nginx/sites-enabled/
#             (и убрать дефолтный сайт: rm /etc/nginx/sites-enabled/default)
# Проверить и применить: nginx -t && systemctl reload nginx
# ============================================================

server {
    # default_server — отвечаем на любой запрос по IP
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/fishmania;
    index index.html;

    # --- защита: лимиты на IP (для людей невидимы) ---
    limit_req  zone=fish_req burst=30 nodelay;
    limit_conn fish_conn 20;
    limit_req_status  429;
    limit_conn_status 429;

    # сайт ничего не принимает от пользователей
    client_max_body_size  16k;
    client_header_timeout 10s;
    client_body_timeout   10s;

    # --- защита: сканеры и боты ---
    if ($fish_bad_bot) { return 444; }                 # 444 — молча закрыть соединение

    # типовые пробы уязвимостей: на статике этого нет и быть не может
    location ~* \.(php|asp|aspx|jsp|cgi|sh|sql|bak)$ { return 444; }
    location ~* ^/(wp-admin|wp-login|wp-content|wp-includes|xmlrpc\.php|phpmyadmin|pma|cgi-bin|vendor/|\.well-known/acme-challenge-fake) { return 444; }

    # --- AI-бэкенд + регистрация + админка (FastAPI, uvicorn 127.0.0.1:8000) ---
    location ^~ /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        client_max_body_size 12m;            # импорт статистики JSON
    }
    location = /admin {                       # закрытая статистика (Basic auth в бэкенде)
        proxy_pass         http://127.0.0.1:8000/admin;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # --- основная статика ---
    location / {
        try_files $uri $uri/ =404;
    }

    # --- не отдаём наружу служебное ---
    location ^~ /ai/      { return 404; }   # внутренняя документация
    location ^~ /deploy/  { return 404; }   # конфиги деплоя
    location ~ /\.        { deny all; }     # .git и прочие точечные
    location ~* \.(ps1|bat|md)$ { return 404; }  # локальные скрипты запуска

    # --- кэш статики ---
    location ~* \.(css|js|svg|png|jpg|jpeg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # --- сжатие ---
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # --- базовые заголовки безопасности ---
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    access_log /var/log/nginx/fishmania.access.log;
    error_log  /var/log/nginx/fishmania.error.log;
}

# ============================================================
# ВАЖНО про геолокацию: на голом HTTP (по IP) браузеры блокируют
# navigator.geolocation — кнопка «Моё местоположение» работать
# не будет (клик по карте и ручные координаты работают).
# Для геолокации нужен HTTPS — см. ai/docs/07-deployment.md.
# ============================================================
