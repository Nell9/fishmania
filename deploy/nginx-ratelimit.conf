# ============================================================
# КлёвГид — зоны лимитов и фильтр ботов (уровень http)
# Положить в: /etc/nginx/conf.d/nginx-ratelimit.conf
# ============================================================

# До 10 запросов/сек с одного IP (страница целиком — ~10 запросов,
# с burst=30 человек не замечает лимит даже при жадном F5)
limit_req_zone  $binary_remote_addr zone=fish_req:10m  rate=10r/s;

# Не больше 20 одновременных соединений с одного IP
limit_conn_zone $binary_remote_addr zone=fish_conn:10m;

# Сканеры и явные парсеры. Браузеры всегда шлют User-Agent,
# поэтому пустой UA тоже режем. curl/wget намеренно НЕ блокируем —
# удобно проверять сайт самому (добавьте при желании).
map $http_user_agent $fish_bad_bot {
    default 0;
    ""      1;
    ~*(masscan|zgrab|censys|shodan|nmap|sqlmap|nikto|dirbuster|gobuster|wpscan|nuclei) 1;
    ~*(python-requests|scrapy|go-http-client|libwww|java/|httpclient|okhttp|aiohttp)   1;
}
